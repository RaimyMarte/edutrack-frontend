<div class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden"
     style="background: radial-gradient(circle at center, #111827 0%, #0B0F19 100%);">
    <!-- Subtle Ambient Glow -->
    <div class="absolute -right-20 -bottom-20 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -left-20 -top-20 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Top Language Toggle Button -->
    <div class="absolute top-6 right-6 z-20">
        <button type="button" (click)="languageService.toggleLanguage()"
            class="px-3.5 py-1.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white text-xs font-bold flex items-center gap-2 hover:bg-slate-800 transition shadow-lg backdrop-blur cursor-pointer">
            <span>{{ languageService.currentLang() === 'en' ? '🇺🇸' : '🇪🇸' }}</span>
            <span>{{ languageService.currentLang() === 'en' ? 'EN' : 'ES' }}</span>
        </button>
    </div>

    <div class="p-8 sm:p-10 shadow-2xl border border-gray-100 w-full max-w-md mx-auto bg-white rounded-3xl relative z-10">
        <!-- Logo & Brand Header -->
        <div class="flex items-center justify-center gap-3.5 mb-8 text-left">
            <div class="rounded-2xl flex items-center justify-center p-2 shadow-md border border-slate-700/60 shrink-0"
                 style="background: linear-gradient(180deg, #0F172A 0%, #111827 100%); width: 3.25rem; height: 3.25rem;">
                <img src="/assets/logo.png" alt="EduTrack Logo" class="w-full h-full object-contain">
            </div>
            <div>
                <h2 class="text-2xl font-black text-gray-900 tracking-tight leading-none mb-1">EduTrack</h2>
                <span class="text-[10px] font-bold text-blue-600 uppercase tracking-widest block">{{ languageService.t('loginSubtitle') }}</span>
            </div>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-4">
            <div>
                <label for="username" class="block text-gray-700 font-bold text-xs uppercase tracking-wider mb-1.5">
                    {{ languageService.t('usernameOrEmail') }}
                </label>
                <input id="username" type="text" [placeholder]="languageService.t('usernameOrEmail')" [(ngModel)]="username" pInputText
                    name="username"
                    class="w-full h-11 px-3.5 text-sm border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 font-medium text-gray-900 transition-all outline-none">
            </div>

            <div>
                <label for="password" class="block text-gray-700 font-bold text-xs uppercase tracking-wider mb-1.5">
                    {{ languageService.t('password') }}
                </label>
                <input id="password" type="password" [placeholder]="languageService.t('password')" [(ngModel)]="password" pInputText
                    name="password"
                    class="w-full h-11 px-3.5 text-sm border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 font-medium text-gray-900 transition-all outline-none">
            </div>

            <div class="flex items-center justify-between text-xs pt-1">
                <div class="flex items-center">
                    <p-checkbox id="rememberMe" [(ngModel)]="rememberMe" [binary]="true" styleClass="mr-2"></p-checkbox>
                    <label for="rememberMe" class="text-gray-700 font-semibold cursor-pointer">{{ languageService.t('rememberMe') }}</label>
                </div>
                <a class="text-blue-600 font-bold hover:underline cursor-pointer">{{ languageService.t('forgotPassword') }}</a>
            </div>

            <button pButton pRipple type="submit" [label]="languageService.t('signIn')"
                class="w-full h-11 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all text-sm mt-2">
            </button>
        </form>
    </div>
</div>

<div class="min-h-screen flex items-center justify-center bg-gray-900 p-4 sm:p-6">
    <div class="p-6 sm:p-8 shadow-lg border-round w-full max-w-md mx-auto bg-white rounded-lg">
        <div class="text-center mb-6">
            <div class="flex justify-center items-center mb-4">
                <div class="relative w-16 h-16">
                    <img src="/assets/logo.png" alt="Logo" class="w-full h-full object-contain rounded-lg">
                </div>
                <div class="ml-4">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-700 mb-1">EduTrack</h2>
                    <span class="text-sm text-gray-500">Learning Management</span>
                </div>
            </div>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
                <label for="username" class="block text-gray-900 font-medium mb-2">Username or Email</label>
                <input id="username" type="text" placeholder="Email address" [(ngModel)]="username" pInputText
                    name="username"
                    class="w-full p-4 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
            </div>

            <div>
                <label for="password" class="block text-gray-900 font-medium mb-2">Password</label>
                <input id="password" type="password" placeholder="Password" [(ngModel)]="password" pInputText
                    name="password"
                    class="w-full p-4 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
            </div>

            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center">
                    <p-checkbox id="rememberMe" [(ngModel)]="rememberMe" [binary]="true" styleClass="mr-2"></p-checkbox>
                    <label for="rememberMe" class="text-gray-900 text-sm sm:text-base">Remember me</label>
                </div>
                <a class="text-blue-500 font-semibold text-sm hover:underline cursor-pointer">Forgot password?</a>
            </div>

            <button pButton pRipple type="submit" label="Sign In" icon="pi pi-user"
                class="w-full bg-blue-500 text-white p-4 rounded-md hover:bg-blue-600 transition-all">
            </button>

            <div class="pt-4 border-t border-gray-200">
                <p class="text-xs text-center text-gray-500 font-semibold mb-3">DEMO QUICK ACCESS (MOCK API)</p>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" (click)="loginAs('admin')"
                        class="px-3 py-2 text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-md border border-blue-200 transition">
                        🔑 Admin (admin)
                    </button>
                    <button type="button" (click)="loginAs('professor')"
                        class="px-3 py-2 text-xs font-semibold text-green-700 bg-green-50 hover:bg-green-100 rounded-md border border-green-200 transition">
                        🎓 Professor (csantana)
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="min-h-screen flex items-center justify-center bg-gray-900 p-4 sm:p-6 relative overflow-hidden">
    <!-- Subtle Background Glow -->
    <div class="absolute -right-20 -bottom-20 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -left-20 -top-20 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Top Language Toggle Button -->
    <div class="absolute top-6 right-6 z-20">
        <button type="button" (click)="languageService.toggleLanguage()"
            class="px-3.5 py-1.5 rounded-xl bg-gray-800/90 border border-gray-700 text-white text-xs font-bold flex items-center gap-2 hover:bg-gray-700 transition shadow-lg">
            <span>{{ languageService.currentLang() === 'en' ? '🇺🇸' : '🇪🇸' }}</span>
            <span>{{ languageService.currentLang() === 'en' ? 'EN' : 'ES' }}</span>
        </button>
    </div>

    <div class="p-6 sm:p-8 shadow-2xl border border-gray-200 w-full max-w-md mx-auto bg-white rounded-2xl relative z-10">
        <div class="text-center mb-6">
            <div class="flex justify-center items-center mb-4">
                <div class="relative w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg p-2">
                    <img src="/assets/logo.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div class="ml-3.5 text-left">
                    <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">EduTrack</h2>
                    <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">{{ languageService.t('loginSubtitle') }}</span>
                </div>
            </div>
            <p class="text-xs text-gray-500 font-medium">
                {{ languageService.t('loginPrompt') }}
            </p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-5">
            <div>
                <label for="username" class="block text-gray-800 font-bold text-sm mb-1.5">
                    {{ languageService.t('usernameOrEmail') }}
                </label>
                <input id="username" type="text" [placeholder]="languageService.t('usernameOrEmail')" [(ngModel)]="username" pInputText
                    name="username"
                    class="w-full p-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none font-medium text-gray-900 transition-all text-sm">
            </div>

            <div>
                <label for="password" class="block text-gray-800 font-bold text-sm mb-1.5">
                    {{ languageService.t('password') }}
                </label>
                <input id="password" type="password" [placeholder]="languageService.t('password')" [(ngModel)]="password" pInputText
                    name="password"
                    class="w-full p-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none font-medium text-gray-900 transition-all text-sm">
            </div>

            <div class="flex items-center justify-between text-sm">
                <div class="flex items-center">
                    <p-checkbox id="rememberMe" [(ngModel)]="rememberMe" [binary]="true" styleClass="mr-2"></p-checkbox>
                    <label for="rememberMe" class="text-gray-700 font-semibold cursor-pointer text-xs sm:text-sm">{{ languageService.t('rememberMe') }}</label>
                </div>
                <a class="text-blue-600 font-bold text-xs hover:underline cursor-pointer">{{ languageService.t('forgotPassword') }}</a>
            </div>

            <button pButton pRipple type="submit" [label]="languageService.t('signIn')" icon="pi pi-sign-in"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all">
            </button>
        </form>
    </div>
</div>

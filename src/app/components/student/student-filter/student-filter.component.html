<p-sidebar [(visible)]="studentFilterSidebar" position="right" styleClass="w-full sm:w-[480px]">
    <ng-template pTemplate="header">
        <div class="ml-2">
            <h2 class="text-2xl font-extrabold text-gray-900 mb-0.5">{{ languageService.t('studentFilter') }}</h2>
            <p class="text-gray-600 text-xs font-medium">{{ languageService.t('refineStudentList') }}</p>
        </div>
    </ng-template>

    <form [formGroup]="studentFilterForm()" (ngSubmit)="applyFilter()" class="p-2" novalidate>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="field">
                <label for="firstName" class="block text-xs font-bold text-gray-800 uppercase mb-1">{{ languageService.t('firstName') }}</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-user"></i>
                    <input type="text" pInputText id="firstName" formControlName="firstName"
                        class="w-full text-sm" [placeholder]="languageService.t('firstName')" />
                </span>
            </div>

            <div class="field">
                <label for="lastName" class="block text-xs font-bold text-gray-800 uppercase mb-1">{{ languageService.t('lastName') }}</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-user"></i>
                    <input type="text" pInputText id="lastName" formControlName="lastName" class="w-full text-sm"
                        [placeholder]="languageService.t('lastName')" />
                </span>
            </div>

            <div class="field">
                <label for="gender" class="block text-xs font-bold text-gray-800 uppercase mb-1">{{ languageService.t('gender') }}</label>
                <p-dropdown [options]="genderOptions" formControlName="gender" [filter]="true" filterBy="Name"
                    optionLabel="Name" [placeholder]="languageService.t('selectGender')" optionValue="Id" styleClass="w-full text-sm"
                    [panelStyleClass]="'text-sm'" [showClear]="true">
                </p-dropdown>
            </div>

            <div class="field">
                <label for="nationalityId" class="block text-xs font-bold text-gray-800 uppercase mb-1">{{ languageService.t('nationality') }}</label>
                <p-dropdown [options]="nationalities" formControlName="nationalityId" [filter]="true" filterBy="Name"
                    optionLabel="Name" [placeholder]="languageService.t('selectNationality')" optionValue="Id"
                    styleClass="w-full text-sm" [panelStyleClass]="'text-sm'" [showClear]="true">
                </p-dropdown>
            </div>

            <div class="field">
                <label for="emailAddress" class="block text-xs font-bold text-gray-800 uppercase mb-1">{{ languageService.t('email') }}</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-envelope"></i>
                    <input type="email" pInputText id="emailAddress" formControlName="emailAddress"
                        class="w-full text-sm" [placeholder]="languageService.t('email')" />
                </span>
            </div>

            <div class="field">
                <label for="phoneNumber" class="block text-xs font-bold text-gray-800 uppercase mb-1">{{ languageService.t('phone') }}</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-phone"></i>
                    <input type="tel" pInputText id="phoneNumber" formControlName="phoneNumber"
                        class="w-full text-sm" [placeholder]="languageService.t('phone')" />
                </span>
            </div>

            <div class="field">
                <label for="code" class="block text-xs font-bold text-gray-800 uppercase mb-1">{{ languageService.t('code') }}</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-id-card"></i>
                    <input type="text" pInputText id="code" formControlName="code" class="w-full text-sm"
                        [placeholder]="languageService.t('code')" />
                </span>
            </div>

            <div class="field">
                <label for="parentName" class="block text-xs font-bold text-gray-800 uppercase mb-1">{{ languageService.t('parentName') }}</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-user"></i>
                    <input type="text" pInputText id="parentName" formControlName="parentName"
                        class="w-full text-sm" [placeholder]="languageService.t('parentName')" />
                </span>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
            <p-button [label]="languageService.t('reset')" type="button" icon="pi pi-refresh" (click)="resetFilter()"
                severity="secondary" [outlined]="true" class="font-semibold">
            </p-button>
            <p-button [label]="languageService.t('applyFilters')" type="submit" icon="pi pi-filter" (click)="applyFilter()"
                severity="primary" class="font-bold">
            </p-button>
        </div>
    </form>
</p-sidebar>

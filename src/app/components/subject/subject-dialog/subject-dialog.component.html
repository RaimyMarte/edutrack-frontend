<p-dialog [(visible)]="subjectDialog" [style]="{ width: '650px' }" [modal]="true"
  styleClass="p-fluid bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden" [breakpoints]="{'960px': '75vw', '640px': '90vw'}"
  [draggable]="false" [resizable]="false" (onHide)="hideDialog()">

  <ng-template pTemplate="header">
    <div class="flex items-center gap-2 text-xl font-bold text-gray-900">
      <i class="pi pi-book text-blue-600 font-bold"></i>
      <span>{{ languageService.t('subjectDetails') }}</span>
    </div>
  </ng-template>

  <ng-template pTemplate="content">
    <form [formGroup]="subjectForm()" (ngSubmit)="saveSubject()" novalidate>
      <div class="grid grid-cols-1 gap-6 p-2">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="field">
            <label for="Code" class="block text-gray-800 font-bold text-sm mb-1">{{ languageService.t('code') }}</label>
            <span class="p-input-icon-left w-full">
              <i class="pi pi-tag"></i>
              <input type="text" pInputText id="Code" formControlName="Code" class="w-full text-sm"
                [placeholder]="languageService.t('code')" />
            </span>
          </div>

          <div class="field">
            <label for="Name" class="block text-gray-800 font-bold text-sm mb-1">{{ languageService.t('name') }} *</label>
            <span class="p-input-icon-left w-full">
              <i class="pi pi-info-circle"></i>
              <input type="text" pInputText id="Name" formControlName="Name"
                [ngClass]="{ 'ng-invalid ng-dirty': submitted && subjectForm().get('Name')?.invalid }"
                class="w-full text-sm" [placeholder]="languageService.t('name')" />
            </span>
            <small class="p-error block mt-1" *ngIf="submitted && subjectForm().get('Name')?.invalid">
              <i class="pi pi-exclamation-circle mr-1"></i>{{ languageService.t('nameRequired') }}
            </small>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="field">
            <label for="StartDate" class="block text-gray-800 font-bold text-sm mb-1">{{ languageService.t('startDate') }} *</label>
            <span class="p-input-icon-left w-full">
              <i class="pi pi-calendar"></i>
              <input type="date" pInputText id="StartDate" formControlName="StartDate"
                [ngClass]="{ 'ng-invalid ng-dirty': submitted && subjectForm().get('StartDate')?.invalid }"
                class="w-full text-sm" />
            </span>
            <small class="p-error block mt-1" *ngIf="submitted && subjectForm().get('StartDate')?.invalid">
              <i class="pi pi-exclamation-circle mr-1"></i>{{ languageService.t('startDateRequired') }}
            </small>
          </div>

          <div class="field">
            <label for="EndDate" class="block text-gray-800 font-bold text-sm mb-1">{{ languageService.t('endDate') }} *</label>
            <span class="p-input-icon-left w-full">
              <i class="pi pi-calendar"></i>
              <input type="date" pInputText id="EndDate" formControlName="EndDate"
                [ngClass]="{ 'ng-invalid ng-dirty': submitted && subjectForm().get('EndDate')?.invalid }"
                class="w-full text-sm" />
            </span>
            <small class="p-error block mt-1" *ngIf="submitted && subjectForm().get('EndDate')?.invalid">
              <i class="pi pi-exclamation-circle mr-1"></i>{{ languageService.t('endDateRequired') }}
            </small>
          </div>
        </div>

        <div class="field">
          <label for="ProfessorId" class="block text-gray-800 font-bold text-sm mb-1">{{ languageService.t('professor') }}</label>
          <p-dropdown [options]="professors" formControlName="ProfessorId" [filter]="true" filterBy="FullName"
            optionLabel="FullName" [placeholder]="languageService.t('selectProfessor')" optionValue="Id"
            styleClass="w-full text-sm" [panelStyleClass]="'text-sm'" [showClear]="true">
          </p-dropdown>
        </div>

        <div class="field">
          <label for="Description" class="block text-gray-800 font-bold text-sm mb-1">{{ languageService.t('description') }}</label>
          <textarea type="text" pInputTextarea id="Description" formControlName="Description"
            class="w-full text-sm" rows="3" [placeholder]="languageService.t('description')"></textarea>
        </div>

        <div class="field">
          <div class="flex items-center">
            <p-checkbox id="Enabled" formControlName="Enabled" [binary]="true" styleClass="mr-2"></p-checkbox>
            <label for="Enabled" class="text-gray-900 font-bold text-sm cursor-pointer">{{ languageService.t('enabled') }}</label>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 px-2 py-3 mt-4 border-t border-gray-100">
        <p-button [label]="languageService.t('cancel')" type="button" icon="pi pi-times" (click)="hideDialog()"
          severity="secondary" [outlined]="true" class="font-semibold">
        </p-button>
        <p-button [label]="languageService.t('save')" type="submit" icon="pi pi-save" (click)="saveSubject()"
          severity="primary" class="font-bold">
        </p-button>
      </div>
    </form>
  </ng-template>
</p-dialog>

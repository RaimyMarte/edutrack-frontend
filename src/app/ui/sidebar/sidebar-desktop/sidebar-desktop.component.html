<aside [ngClass]="{'w-64': sidebarVisible, 'w-[72px]': !sidebarVisible}"
    style="background: linear-gradient(180deg, #0F172A 0%, #111827 100%); border-right: 1px solid rgba(255,255,255,0.06); position: fixed; top: 0; left: 0; bottom: 0; height: 100vh; z-index: 30;"
    class="p-3 transition-all duration-300 ease-in-out flex flex-col shadow-2xl overflow-hidden select-none">
    <sidebar-content [sidebarVisible]="sidebarVisible" class="h-full flex flex-col flex-1 min-h-0"></sidebar-content>
</aside>

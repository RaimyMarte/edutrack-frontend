<div *ngIf="isMobile; else desktopSidebar">
      <app-sidebar-mobile [(sidebarVisible)]="sidebarVisible" (sidebarVisibleChange)="sidebarVisibleChange.emit($event)"></app-sidebar-mobile>
</div>
<ng-template #desktopSidebar>
      <app-sidebar-desktop [sidebarVisible]="sidebarVisible"></app-sidebar-desktop>
</ng-template>

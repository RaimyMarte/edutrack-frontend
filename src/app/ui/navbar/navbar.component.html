<p-menubar styleClass="border-none shadow-sm bg-white rounded-none px-2 sm:px-4 py-2">
  <ng-template pTemplate="start">
    <button pButton pRipple icon="pi pi-bars" (click)="toggleSidebar()" class="p-button-text p-button-rounded text-gray-700 hover:bg-gray-100"
      [pTooltip]="sidebarVisible ? 'Hide Sidebar' : 'Show Sidebar'" tooltipPosition="bottom">
    </button>
  </ng-template>

  <ng-template pTemplate="end">
    <div class="flex items-center gap-1.5 sm:gap-3" *ngIf="authService.currentUserValue">
      <!-- Language Switcher Button -->
      <button pButton pRipple type="button" (click)="languageService.toggleLanguage()"
        class="p-button-outlined p-button-secondary p-button-sm flex items-center gap-1 text-xs font-bold px-2 sm:px-3 py-1.5 rounded-xl border-gray-300 hover:border-gray-400 hover:bg-gray-100 transition shadow-sm"
        [pTooltip]="languageService.currentLang() === 'en' ? 'Cambiar a Español' : 'Switch to English'"
        tooltipPosition="bottom">
        <span class="text-sm sm:text-base">{{ languageService.currentLang() === 'en' ? '🇺🇸' : '🇪🇸' }}</span>
        <span class="text-gray-700 font-bold text-xs">{{ languageService.currentLang() === 'en' ? 'EN' : 'ES' }}</span>
      </button>

      <!-- User Profile Pill -->
      <div class="flex items-center gap-2 px-2 sm:px-3 py-1.5 rounded-xl bg-gray-50 border border-gray-200">
        <p-avatar [image]="authService.currentUserValue.Picture ||''" styleClass="border border-gray-200 shadow-sm"
          [pTooltip]="(languageService.currentLang() === 'en' ? 'Logged in as ' : 'Conectado como ') + (authService.currentUserValue.UserName || authService.currentUserValue.Email)"
          tooltipPosition="bottom" shape="circle">
        </p-avatar>
        <span class="font-bold text-gray-800 text-xs sm:text-sm hidden md:inline truncate max-w-[120px]">
          {{ authService.currentUserValue.FullName }}
        </span>
      </div>

      <!-- Logout Button -->
      <button pButton pRipple (click)="logout()" icon="pi pi-sign-out"
        [pTooltip]="languageService.currentLang() === 'en' ? 'Sign out' : 'Cerrar sesión'"
        tooltipPosition="bottom" class="p-button-text p-button-danger text-xs sm:text-sm p-2 rounded-xl flex items-center">
        <span class="hidden sm:inline font-bold ml-1">{{ languageService.currentLang() === 'en' ? 'Logout' : 'Salir' }}</span>
      </button>
    </div>
  </ng-template>
</p-menubar>
